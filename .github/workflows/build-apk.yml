
name: Build Vocal Remover APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Check Flutter
        run: flutter --version

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.shahabmillizai .
          fi

      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle_file = next(
              (p for p in candidates if p.exists()), None
          )

          if gradle_file is None:
              raise SystemExit("Android Gradle file not found.")

          source = gradle_file.read_text()
          updated = source

          updated = re.sub(
              r"compileSdk\s*=\s*flutter\.compileSdkVersion",
              "compileSdk = 36",
              updated
          )

          updated = re.sub(
              r"compileSdkVersion\s+flutter\.compileSdkVersion",
              "compileSdkVersion 36",
              updated
          )

          updated = re.sub(
              r"compileSdk\s+flutter\.compileSdkVersion",
              "compileSdk 36",
              updated
          )

          if updated == source and not re.search(
              r"compileSdk\s*(?:=\s*)?36\b", source
          ):
              raise SystemExit("Could not update compileSdk.")

          gradle_file.write_text(updated)
          print(f"Using compileSdk 36 in {gradle_file}")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze
        continue-on-error: true

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vocal-Remover-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
